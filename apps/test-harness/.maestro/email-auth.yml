appId: dev.uixvisor.testharness
name: Email auth completes with OTP
---
- launchApp:
    clearState: true
- assertVisible: UIXVISOR test harness
- tapOn:
    id: flow-email-auth
- assertVisible: Sign in
- tapOn:
    id: sign-in-email-input
- inputText: ada@example.com
- tapOn:
    id: sign-in-password-input
- inputText: secret123
- hideKeyboard
- waitForAnimationToEnd
- tapOn:
    id: sign-in-continue
- assertVisible: Verify your code
- tapOn:
    id: otp-code-input
- inputText: 123456
- hideKeyboard
- tapOn: Verify
- assertVisible: Email auth complete
- assertVisible: Completed sign-in with OTP verification.
