appId: dev.uixvisor.testharness
name: Phone auth completes with OTP
---
- launchApp:
    clearState: true
- assertVisible: UIXVISOR test harness
- tapOn:
    id: flow-phone-auth
- assertVisible: Enter your phone
- tapOn:
    id: phone-auth-phone-input
- inputText: 15550100
- hideKeyboard
- waitForAnimationToEnd
- tapOn:
    id: phone-auth-continue
- assertVisible: Verify your code
- tapOn:
    id: otp-code-input
- inputText: 654321
- hideKeyboard
- tapOn: Verify
- assertVisible: Phone auth complete
- assertVisible: Verified 0100 with OTP.
