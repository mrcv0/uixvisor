appId: dev.uixvisor.testharness
---
- launchApp:
    clearState: true
- assertVisible: UIXVISOR test harness
- scrollUntilVisible:
    element:
      id: open-sheet
    direction: DOWN
- waitForAnimationToEnd
- tapOn:
    id: open-sheet
- waitForAnimationToEnd
- assertVisible:
    id: bottom-sheet
- assertVisible: Sheet title
- tapOn: Close sheet
- assertNotVisible: Sheet title
