name: E2E (Maestro)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'android or ios'
        required: true
        default: 'android'
        type: choice
        options:
          - android
          - ios

jobs:
  maestro:
    name: Maestro ${{ inputs.platform }}
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      MAESTRO_CLI_NO_ANALYTICS: '1'

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          cache: npm

      - name: Use pinned npm
        run: npm install --global npm@11.9.0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Install Maestro
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Install Android system image
        if: inputs.platform == 'android'
        run: |
          printf 'y\n' | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "system-images;android-33;google_apis;arm64-v8a"
          test -d "$ANDROID_HOME/system-images/android-33/google_apis/arm64-v8a"

      - name: Start ${{ inputs.platform }} device
        run: maestro start-device --platform "${{ inputs.platform }}"

      - name: Build and install the harness app
        id: app
        working-directory: apps/test-harness
        shell: bash
        run: |
          if [[ "${{ inputs.platform }}" == "android" ]]; then
            DEVICE_ID="$(adb devices | awk 'NR > 1 && $2 == "device" { print $1; exit }')"
            if [[ -z "$DEVICE_ID" ]]; then
              echo "No booted Android emulator found" >&2
              exit 1
            fi
            npm exec expo -- run:android --variant release --no-bundler --device "$DEVICE_ID"
          else
            DEVICE_ID="$(xcrun simctl list devices booted | awk -F '[()]' '/Booted/ { print $2; exit }')"
            if [[ -z "$DEVICE_ID" ]]; then
              echo "No booted iOS simulator found" >&2
              exit 1
            fi
            npm exec expo -- run:ios --configuration Release --no-bundler --device "$DEVICE_ID"
          fi
          echo "device_id=$DEVICE_ID" >> "$GITHUB_OUTPUT"

      - name: Run Maestro flows
        working-directory: apps/test-harness
        run: maestro --device "${{ steps.app.outputs.device_id }}" test .maestro
