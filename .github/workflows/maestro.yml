name: E2E (Maestro)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "android or ios"
        required: true
        default: "android"
        type: choice
        options:
          - android
          - ios

jobs:
  maestro:
    name: Maestro ${{ inputs.platform }}
    runs-on: ${{ inputs.platform == 'android' && 'ubuntu-latest' || 'macos-latest' }}
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      MAESTRO_CLI_NO_ANALYTICS: "1"

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          cache: npm

      - name: Use pinned npm
        run: npm install --global npm@11.9.0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Install Maestro
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM
        if: inputs.platform == 'android'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build and test on Android
        if: inputs.platform == 'android'
        env:
          ORG_GRADLE_PROJECT_reactNativeArchitectures: x86_64
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          working-directory: apps/test-harness
          script: >-
            npm exec expo -- run:android --variant release --no-bundler &&
            maestro --device emulator-5554 test .maestro

      - name: Start iOS device
        if: inputs.platform == 'ios'
        run: maestro start-device --platform ios

      - name: Build and test on iOS
        if: inputs.platform == 'ios'
        working-directory: apps/test-harness
        shell: bash
        run: |
          DEVICE_ID="$(xcrun simctl list devices booted | awk -F '[()]' '/Booted/ { print $2; exit }')"
          if [[ -z "$DEVICE_ID" ]]; then
            echo "No booted iOS simulator found" >&2
            exit 1
          fi
          npm exec expo -- run:ios --configuration Release --no-bundler --device "$DEVICE_ID"
          maestro --device "$DEVICE_ID" test .maestro
